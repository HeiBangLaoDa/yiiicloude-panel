name: Deploy yiiicloude-panel to Tencent Cloud

# 流程：
#   build-and-push: GH Actions runner 跑 docker buildx → push GHCR
#                   （prod 机器 4G RAM 不够 build，只在 CI build）
#   deploy:         ssh 腾讯云 docker pull + compose up（不 build）

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      restart_full_stack:
        description: '重启整栈（含 panel-pg）。默认只重启 panel-app'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-yiiicloude-panel
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: heibanglaoda/yiiicloude-panel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TENCENT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.TENCENT_PORT }} ${{ secrets.TENCENT_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull image + restart)
        env:
          RESTART_FULL: ${{ github.event.inputs.restart_full_stack || 'false' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.TENCENT_PORT }} \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              ${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }} \
              "RESTART_FULL=$RESTART_FULL bash -s" <<'ENDSSH'
          set -euo pipefail

          PROJECT_DIR=/opt/yiiicloude-panel
          ENV_FILE=/etc/yiiicloude-panel/.env
          COMPOSE="docker compose -f docker/docker-compose.prod.yml --env-file $ENV_FILE"

          if [[ ! -d "$PROJECT_DIR/.git" ]]; then
              echo "❌ $PROJECT_DIR 还不是 git 仓库。先 clone"
              exit 1
          fi
          if [[ ! -f "$ENV_FILE" ]]; then
              echo "❌ $ENV_FILE 不存在"
              exit 1
          fi

          cd "$PROJECT_DIR"
          echo "==> [1/3] git pull (sync compose / scripts)"
          git pull --ff-only

          echo "==> [2/3] docker pull 最新 panel-app 镜像"
          $COMPOSE pull panel-app

          if [[ "$RESTART_FULL" == "true" ]]; then
              echo "==> [3/3] 重启整栈"
              $COMPOSE up -d --remove-orphans
          else
              echo "==> [3/3] 滚动重启 panel-app"
              $COMPOSE up -d --no-build --remove-orphans panel-app
          fi

          echo "等 panel-app /api/access"
          for i in {1..40}; do
              if curl -fs http://127.0.0.1:3010/api/access >/dev/null 2>&1; then
                  echo "✅ /api/access 200"
                  exit 0
              fi
              sleep 3
          done
          echo "❌ 120s 内 /api/access 没响应"
          $COMPOSE logs --tail 80 panel-app
          exit 1
          ENDSSH
